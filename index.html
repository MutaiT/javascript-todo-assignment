<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>My To-Do List</h1>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="What do you need to do?">
      <button type="submit" id="add-btn">Add Task</button>
    </form>

    <p id="error-msg" class="error"></p>

    <div class="toolbar">
      <span id="task-counter">0 tasks</span>
      <button id="clear-btn" class="clear-btn">Clear All</button>
    </div>

    <ul id="task-list"></ul>

    <p id="empty-msg" class="empty">No tasks yet. Add one above!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
